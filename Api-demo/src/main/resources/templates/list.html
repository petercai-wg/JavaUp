<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

</head>

<body>

<div th:if="${message}"
     class="alert alert-success alert-dismissible fade show"
     role="alert">

    <span th:text="${message}"></span>

    <button type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close">
    </button>

</div>

<div class="container mt-4">
    <div class="d-flex justify-content-between">
        <h1>Home Page</h1>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <form method="Get" action="/web/list">
                <div class="input-group">
                    <input
                            type="text"
                            class="form-control"
                            name="keyword"
                            placeholder="Search ..."
                            th:value="${keyword}">

                    <button class="btn btn-primary mx-3 px-1" type="submit">
                        Search
                    </button>
                </div>
            </form>
        </div>
    </div>

    <form action="/web/releaseSelected"
          method="post"
          onsubmit="return confirmSubmitSelected();">
        <button class="btn btn-primary"
                type="submit">
            Submit Selected
        </button>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th width="40">
            </th>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="server : ${servers}">
            <td>
                <input
                        class="form-check-input rowCheck"
                        type="checkbox"
                        name="selectedIds"
                        th:value="${server.id}">

            </td>
            <td th:text="${server.id}">1</td>
            <td th:text="${server.name}">Sample Item</td>
            <td th:text="${server.status}">Active</td>
            <td>
                <a      hx-get="/web/server/{id}(id=${server.id})"
                        th:attr="hx-get=@{/web/server/{id}(id=${server.id})}"
                        hx-target="#details"
                        hx-swap="innerHTML">
                    <button type="button"
                            class="btn btn-primary btn-sm">View Detail</button>
                </a>
                        <!--                <form th:action="@{/web/release/{id}(id=${server.id})}"-->
<!--                      method="post"-->
<!--                    <button type="submit"-->
<!--                            class="btn btn-primary btn-sm">-->
<!--                        Release-->
<!--                    </button>-->
<!--                </form>-->
            </td>
        </tr>
        </tbody>
    </table>
    </form>
</div>

<div id="details">
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
